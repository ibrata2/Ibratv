apply plugin: 'com.android.application'

// version comes from the shared package.json so Windows + Android always match
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def (vMaj, vMin, vPat) = pkg.version.tokenize('.').collect { it.replaceAll(/[^0-9]/, '').toInteger() }

android {
    namespace = "com.ibrata2.ibratv"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ibrata2.ibratv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMaj * 10000 + vMin * 100 + vPat
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // stable key from CI secrets so updates install over the previous version
            def ks = System.getenv("IBRATV_KEYSTORE")
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("IBRATV_KEYSTORE_PASSWORD")
                keyAlias System.getenv("IBRATV_KEY_ALIAS") ?: "ibratv"
                keyPassword System.getenv("IBRATV_KEYSTORE_PASSWORD")
            }
        }
    }

    flavorDimensions = ["device"]
    productFlavors {
        mobile {
            dimension "device"
            applicationIdSuffix ".mobile"
            resValue "string", "app_name", "IBRATV موبايل"
            resValue "string", "title_activity_main", "IBRATV موبايل"
        }
        car {
            dimension "device"
            applicationIdSuffix ".car"
            resValue "string", "app_name", "IBRATV للسيارة"
            resValue "string", "title_activity_main", "IBRATV للسيارة"
        }
        tv {
            dimension "device"
            applicationIdSuffix ".tv"
            resValue "string", "app_name", "IBRATV للتلفزيون"
            resValue "string", "title_activity_main", "IBRATV للتلفزيون"
        }
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def names = [mobile: "Mobile", car: "Car", tv: "TV"]
            outputFileName = "IBRATV-${variant.versionName}-Android-${names[variant.flavorName]}.apk"
        }
    }

    buildTypes {
        release {
            // no key on this machine/CI → unsigned APKs (signed afterwards with the IBRATV key)
            if (signingConfigs.release.storeFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
