name: Build IBRATV (Windows + Android + iPhone)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "logo.png"
      - "logo-small.png"
      - "vendor/**"
      - "fonts/**"
      - "build/**"
      - "package.json"
      - "electron/**"
      - "android/**"
      - "ios/**"
      - "android-bridge.js"
      - "cinema.js"
      - "adblock-hosts.txt"
      - "capacitor.config.json"
      - "scripts/**"
      - "CHANGELOG-latest.md"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write   # needed to publish the release the in-app updater reads

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer and portable EXE
        run: npm run dist

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IBRATV-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      # The app checks github.com/ibrata2/ibratv/releases/latest and offers the update in-app.
      - name: Publish release v${{ steps.ver.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: IBRATV ${{ steps.ver.outputs.version }}
          make_latest: true
          overwrite_files: true
          body_path: CHANGELOG-latest.md
          files: |
            dist/IBRATV-${{ steps.ver.outputs.version }}-Setup.exe
            dist/IBRATV-${{ steps.ver.outputs.version }}-portable.exe

  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install

      - name: Copy web app into the Android project
        run: npm run android:sync

      - name: Signing key (if the IBRATV_KEYSTORE_B64 secret is set)
        env:
          KS_B64: ${{ secrets.IBRATV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ibratv.jks"
            echo "IBRATV_KEYSTORE=$RUNNER_TEMP/ibratv.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs — Mobile, Car, TV
        env:
          IBRATV_KEYSTORE_PASSWORD: ${{ secrets.IBRATV_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            msg=$(grep -E "error:|What went wrong|^e: |Could not|Cannot|failed|Exception:|\.java:[0-9]+" "$RUNNER_TEMP/gradle.log" | grep -v "BUILD FAILED" | head -25 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Android build failed::$msg"
            exit 1
          fi

      - name: Collect APKs
        id: apks
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p out
          for f in android/app/build/outputs/apk/*/release/*.apk; do
            name=$(basename "$f")
            if [ -z "$IBRATV_KEYSTORE" ]; then name="${name%.apk}-unsigned.apk"; fi
            cp "$f" "out/$name"
          done
          ls -la out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IBRATV-Android
          path: out/*.apk
          retention-days: 14

      # unsigned builds are named *-unsigned.apk (the in-app updater ignores them) until the key secrets are set
      - name: Attach APKs to release v${{ steps.apks.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apks.outputs.version }}
          overwrite_files: true
          files: out/*.apk

  # iPhone / iPad — built on GitHub's macOS machines (no Mac needed), unsigned IPA for self-signing
  ios:
    needs: build
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install

      - name: Copy web app into the iOS project
        run: |
          node scripts/build-web.cjs
          npx cap sync ios

      - name: Version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "v=require('./package.json').version.split('.').map(Number);v[0]*10000+v[1]*100+v[2]")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/g; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $CODE;/g" ios/App/App.xcodeproj/project.pbxproj

      - name: Build unsigned IPA
        run: |
          set +e
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcode.log" | grep -E "error:|warning: .*deprecated|BUILD" | head -50
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            msg=$(grep -E "error:|failed" "$RUNNER_TEMP/xcode.log" | head -20 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=iOS build failed::$msg"
            exit 1
          fi
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "out/IBRATV-${{ steps.ver.outputs.version }}-iPhone.ipa" Payload
          ls -la out

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IBRATV-iPhone
          path: out/*.ipa
          retention-days: 14

      - name: Attach IPA to release v${{ steps.ver.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          overwrite_files: true
          files: out/*.ipa
