name: Build IBRATV for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "icon.svg"
      - "package.json"
      - "electron/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer and portable EXE
        run: npm run dist

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IBRATV-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
